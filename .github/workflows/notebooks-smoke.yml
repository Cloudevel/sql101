name: Notebooks Smoke Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Estructura y ejecución completa de todos los notebooks y sus soluciones.
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate course data
        run: |
          python scripts/generar_datos.py
          python scripts/cargar_datos.py

      - name: Validate notebook structure
        run: |
          python - <<'PY'
          import glob
          import os

          import nbformat

          NOTEBOOKS = sorted(glob.glob("[0-9][0-9]_*.ipynb"))
          NOTEBOOKS += sorted(glob.glob(os.path.join("soluciones", "[0-9][0-9]_*_soluciones.ipynb")))
          for path in NOTEBOOKS:
              nbformat.validate(nbformat.read(path, as_version=4))
              print(f"[OK] {path}")
          PY

      - name: Execute notebooks and solutions
        run: |
          python - <<'PY'
          import glob
          import os
          import sys

          import nbformat
          from nbclient import NotebookClient

          NOTEBOOKS = sorted(glob.glob("[0-9][0-9]_*.ipynb"))
          NOTEBOOKS += sorted(glob.glob(os.path.join("soluciones", "[0-9][0-9]_*_soluciones.ipynb")))

          fallas = []
          for path in NOTEBOOKS:
              print(f"\n[SMOKE] Ejecutando: {path}")
              nb = nbformat.read(path, as_version=4)
              client = NotebookClient(nb, timeout=600, kernel_name="python3", allow_errors=False,
                                      resources={"metadata": {"path": os.path.dirname(path) or "."}})
              try:
                  client.execute()
              except Exception as exc:  # noqa: BLE001
                  print(f"[ERROR] {path}: {type(exc).__name__}: {str(exc)[:500]}")
                  fallas.append(path)
                  continue
              # JupySQL muestra los errores de SQL como salida, sin lanzar excepción: se revisan aquí.
              for i, cell in enumerate(nb.cells):
                  for out in cell.get("outputs", []):
                      texto = out.get("text", "") or out.get("data", {}).get("text/plain", "")
                      if isinstance(texto, list):
                          texto = "".join(texto)
                      if out.get("output_type") == "error" or "Error:" in texto:
                          print(f"[ERROR] {path} celda {i}: {texto[:300]}")
                          fallas.append(f"{path} celda {i}")
              if not fallas or not fallas[-1].startswith(path):
                  print(f"[OK] {path}")

          if fallas:
              print("\n[SMOKE] Fallaron:", *fallas, sep="\n  - ")
              sys.exit(1)
          print("\n[SMOKE] Todos los notebooks se ejecutaron sin errores.")
          PY
